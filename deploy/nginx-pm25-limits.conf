# Shared rate-limit zones. MUST live in the http{} context, so install to
# /etc/nginx/conf.d/ (included by the default nginx.conf), not inside the
# site file.
#
#   sudo cp deploy/nginx-pm25-limits.conf /etc/nginx/conf.d/pm25-limits.conf
#
# 10m of shared memory tracks roughly 160,000 addresses.

limit_req_zone $binary_remote_addr zone=pm25_predict:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pm25_mobile:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=pm25_general:10m rate=120r/m;

# Cap simultaneous connections per client as well.
limit_conn_zone $binary_remote_addr zone=pm25_conn:10m;
