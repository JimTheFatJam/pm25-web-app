# nginx site for https://pm25.dcism.org/
#
#   sudo cp deploy/nginx-pm25.conf /etc/nginx/sites-available/pm25
#   sudo ln -s /etc/nginx/sites-available/pm25 /etc/nginx/sites-enabled/pm25
#   sudo cp deploy/nginx-pm25-limits.conf /etc/nginx/conf.d/pm25-limits.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS certificate: sudo certbot --nginx -d pm25.dcism.org
# (certbot rewrites the listen/ssl lines below in place.)

server {
    listen 80;
    listen [::]:80;
    server_name pm25.dcism.org;
    # certbot adds the redirect to 443 here.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pm25.dcism.org;

    ssl_certificate     /etc/letsencrypt/live/pm25.dcism.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pm25.dcism.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Matches the app's own MAX_CONTENT_LENGTH; rejects oversized bodies
    # before they ever reach Python.
    client_max_body_size 2m;

    access_log /var/log/nginx/pm25.access.log;
    error_log  /var/log/nginx/pm25.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;

    # --- static frontend, served directly (never touches Python) ---
    root /srv/pm25-web-app/frontend;

    location = / {
        try_files /index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|ico|geojson)$ {
        try_files $uri @app;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- the expensive endpoints: a second, shared rate limit ---
    # burst=3 nodelay lets a normal click-through through; a script does not
    # get past it. The app's own per-IP limits in backend/limits.py are the
    # precise ones -- this is defence in depth and runs before Python does.
    location = /api/generate_prediction {
        limit_req zone=pm25_predict burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5050;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }

    location = /api/mobile/prediction {
        limit_req zone=pm25_mobile burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5050;
        include /etc/nginx/proxy_params;
        # A cold cell takes 15-25 s server-side; allow headroom.
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=pm25_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5050;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }

    location @app {
        proxy_pass http://127.0.0.1:5050;
        include /etc/nginx/proxy_params;
    }

    location / {
        try_files $uri @app;
    }
}
